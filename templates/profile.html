<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Profile | RentWise AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='dashboard.css') }}">

</head>


<body>

<div class="dashboard">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="side-logo">
            RentWise <span>AI</span>
        </div>


        <div class="menu-title">
            MAIN MENU
        </div>


        <a href="{{ url_for('dashboard') }}"
           class="menu">

            <span>⌂</span>

            Dashboard

        </a>


        <a href="{{ url_for('dashboard') }}#analyze"
           class="menu">

            <span>📄</span>

            Analyze Agreement

        </a>


        <a href="{{ url_for('history') }}"
           class="menu">

            <span>◷</span>

            History

        </a>


        <div class="menu-title second">
            ACCOUNT
        </div>


        <a href="{{ url_for('profile') }}"
           class="menu active">

            <span>◯</span>

            Profile

        </a>


        <a href="{{ url_for('logout') }}"
           class="menu logout">

            <span>↪</span>

            Logout

        </a>

    </aside>



    <!-- MAIN -->

    <main class="main">


        <header class="topbar">

            <div>

                <p class="welcome">
                    Account
                </p>

                <h1>
                    My Profile
                </h1>

            </div>


            <div class="user">

                <div class="avatar">

                    {{ user.name[0]|upper }}

                </div>


                <div>

                    <strong>
                        {{ user.name }}
                    </strong>

                    <small>
                        User
                    </small>

                </div>

            </div>

        </header>



        <section style="
            padding:40px;
            max-width:800px;
        ">


            <div style="
                background:white;
                border-radius:18px;
                padding:35px;
                border:1px solid #eeeeee;
            ">


                <div style="
                    width:85px;
                    height:85px;
                    border-radius:50%;
                    background:#635bff;
                    color:white;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    font-size:32px;
                    font-weight:700;
                    margin-bottom:25px;
                ">

                    {{ user.name[0]|upper }}

                </div>


                <form method="POST">


                    <label style="
                        display:block;
                        margin-bottom:8px;
                        font-weight:600;
                    ">

                        Full Name

                    </label>


                    <input
                        type="text"
                        name="name"
                        value="{{ user.name }}"
                        required
                        style="
                        width:100%;
                        box-sizing:border-box;
                        padding:13px;
                        border:1px solid #ddd;
                        border-radius:8px;
                        margin-bottom:22px;
                        "
                    >


                    <label style="
                        display:block;
                        margin-bottom:8px;
                        font-weight:600;
                    ">

                        Email Address

                    </label>


                    <input
                        type="email"
                        value="{{ user.email }}"
                        disabled
                        style="
                        width:100%;
                        box-sizing:border-box;
                        padding:13px;
                        border:1px solid #ddd;
                        border-radius:8px;
                        background:#f5f5f5;
                        margin-bottom:25px;
                        "
                    >


                    <button
                        type="submit"
                        style="
                        background:#635bff;
                        color:white;
                        border:none;
                        padding:13px 25px;
                        border-radius:8px;
                        cursor:pointer;
                        font-weight:600;
                        ">

                        Save Changes

                    </button>


                </form>

            </div>

        </section>


    </main>

</div>

</body>

</html>
